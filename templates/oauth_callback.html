<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }}

        body {{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            color: #ffffff;
            overflow: hidden;
        }}

        /* Ambient glow orbs */
        body::before,
        body::after {{
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }}

        body::before {{
            width: 500px;
            height: 500px;
            background: {glow_color};
            opacity: 0.15;
            top: -150px;
            right: -150px;
            animation: float 8s ease-in-out infinite;
        }}

        body::after {{
            width: 400px;
            height: 400px;
            background: #5B5FC7;
            opacity: 0.12;
            bottom: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }}

        .card {{
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 56px 48px;
            text-align: center;
            max-width: 460px;
            width: 90%;
            box-shadow:
                0 32px 64px -16px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }}

        .card:hover {{
            transform: translateY(-4px);
            box-shadow:
                0 40px 80px -16px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }}

        .logos {{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
        }}

        .logo-wrap {{
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }}

        .logo-wrap:hover {{
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }}

        .logo-wrap img {{
            width: 32px;
            height: 32px;
            display: block;
        }}

        .logos-separator {{
            color: rgba(255, 255, 255, 0.3);
            font-size: 20px;
            font-weight: 500;
            line-height: 1;
        }}

        .status-icon {{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: {icon_bg};
            border: 2px solid {icon_border};
            margin-bottom: 28px;
            animation: popIn 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            font-size: 36px;
            line-height: 1;
            box-shadow: 0 12px 24px {icon_bg};
        }}

        h1 {{
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
            color: #ffffff;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }}

        .message {{
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
        }}

        .meta-row {{
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }}

        .divider {{
            width: 48px;
            height: 3px;
            background: {accent_color};
            border-radius: 3px;
            margin: 28px auto;
            opacity: 0.5;
        }}

        .action-text {{
            font-size: 14px;
            font-weight: 600;
            color: {action_color};
            text-transform: uppercase;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
        }}

        @keyframes float {{
            0%, 100% {{ transform: translate(0, 0); }}
            50% {{ transform: translate(20px, 20px); }}
        }}

        @keyframes slideUp {{
            from {{
                transform: translateY(40px);
                opacity: 0;
            }}
            to {{
                transform: translateY(0);
                opacity: 1;
            }}
        }}

        @keyframes popIn {{
            from {{
                transform: scale(0.4);
                opacity: 0;
            }}
            to {{
                transform: scale(1);
                opacity: 1;
            }}
        }}

        @keyframes pulse {{
            0%, 100% {{ opacity: 1; }}
            50% {{ opacity: 0.6; }}
        }}
    </style>
</head>

<body>
    <div class="card">
        <div class="logos">
            <div class="logo-wrap">
                <img src="https://cdn.simpleicons.org/databricks/FF3621" alt="Databricks" />
            </div>
            <span class="logos-separator">+</span>
            <div class="logo-wrap">
                <img src="https://docs.microsoft.com/en-us/media/logos/logo_MSTeams.svg" alt="Microsoft Teams" />
            </div>
        </div>

        <div class="status-icon">{icon}</div>

        <h1>{title}</h1>
        <p class="message">{message}</p>

        <div class="meta-row">{timestamp}</div>

        <div class="divider"></div>

        <div class="action-text">{action_text}</div>
    </div>
</body>

</html>
