<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
                {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
        }

        body {
                {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
                background: linear-gradient(135deg, #0d1117 0%, #1B3139 50%, #0f2027 100%);
                color: #ffffff;
                overflow: hidden;
            }
        }

        /* Ambient glow orbs */
        body::before,
        body::after {
                {
                content: '';
                position: fixed;
                border-radius: 50%;
                filter: blur(80px);
                z-index: 0;
                pointer-events: none;
            }
        }

        body::before {
                {
                width: 400px;
                height: 400px;

                background: {
                    glow_color
                }

                ;
                opacity: 0.15;
                top: -100px;
                right: -100px;
            }
        }

        body::after {
                {
                width: 300px;
                height: 300px;
                background: #5B5FC7;
                opacity: 0.12;
                bottom: -80px;
                left: -80px;
            }
        }

        .card {
                {
                position: relative;
                z-index: 1;
                background: rgba(255, 255, 255, 0.06);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 20px;
                padding: 52px 44px;
                text-align: center;
                max-width: 440px;
                width: 90%;
                box-shadow:
                    0 32px 64px -16px rgba(0, 0, 0, 0.6),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
                animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
        }

        .logos {
                {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                margin-bottom: 28px;
            }
        }

        .logo-wrap {
                {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 10px;
                padding: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
            }
        }

        .logo-wrap img {
                {
                width: 24px;
                height: 24px;
                display: block;
            }
        }

        .logos-separator {
                {
                color: rgba(255, 255, 255, 0.35);
                font-size: 18px;
                font-weight: 500;
                line-height: 1;
            }
        }

        .status-icon {
                {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 72px;
                height: 72px;
                border-radius: 50%;

                background: {
                    icon_bg
                }

                ;

                border: 2px solid {
                    icon_border
                }

                ;
                margin-bottom: 24px;
                animation: popIn 0.4s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
                font-size: 32px;
                line-height: 1;
            }
        }

        h1 {
                {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: -0.02em;
                margin-bottom: 12px;
                color: #ffffff;
            }
        }

        .message {
                {
                font-size: 15px;
                line-height: 1.65;
                color: rgba(255, 255, 255, 0.75);
            }
        }

        .meta-row {
                {
                margin-top: 20px;
                font-size: 13px;
                color: rgba(255, 255, 255, 0.4);
            }
        }

        .divider {
                {
                width: 40px;
                height: 2px;

                background: {
                    accent_color
                }

                ;
                border-radius: 2px;
                margin: 24px auto;
                opacity: 0.6;
            }
        }

        .action-text {
                {
                font-size: 13px;
                font-weight: 600;

                color: {
                    action_color
                }

                ;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }
        }

        @keyframes slideUp {
                {
                from {
                        {
                        transform: translateY(32px);
                        opacity: 0;
                    }
                }

                to {
                        {
                        transform: translateY(0);
                        opacity: 1;
                    }
                }
            }
        }

        @keyframes popIn {
                {
                from {
                        {
                        transform: scale(0.5);
                        opacity: 0;
                    }
                }

                to {
                        {
                        transform: scale(1);
                        opacity: 1;
                    }
                }
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logos">
            <div class="logo-wrap">
                <img src="https://cdn.simpleicons.org/databricks/FF3621" alt="Databricks" />
            </div>
            <span class="logos-separator">+</span>
            <div class="logo-wrap">
                <img src="https://docs.microsoft.com/en-us/media/logos/logo_MSTeams.svg" alt="Microsoft Teams" />
            </div>
        </div>

        <div class="status-icon">{icon}</div>

        <h1>{title}</h1>
        <p class="message">{message}</p>

        <div class="meta-row">{timestamp}</div>

        <div class="divider"></div>

        <div class="action-text">{action_text}</div>
    </div>
</body>

</html>
