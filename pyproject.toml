[project]
name = "dbrx-genie-teams-365"
version = "0.1.0"
description = "A Microsoft Teams agent that can interact with Databricks and other services to provide insights and assistance to users."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioodbc>=0.5.0",
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.11",
    "boto3>=1.43.34",
    "cryptography>=49.0.0",
    "databricks-sdk>=0.118.0",
    "dotenv>=0.9.9",
    "greenlet>=3.5.2",
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "microsoft-agents-activity>=1.1.0",
    "microsoft-agents-authentication-msal>=1.1.0",
    "microsoft-agents-hosting-core>=1.1.0",
    "microsoft-agents-hosting-fastapi>=1.1.0",
    "microsoft-agents-hosting-teams>=1.1.0",
    "microsoft-agents-storage-blob>=1.1.0",
    "microsoft-agents-storage-cosmos>=1.1.0",
    "polars>=1.41.2",
    "sqlmodel>=0.0.38",
    "thefuzz>=0.22.1",
    "uvicorn>=0.49.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
